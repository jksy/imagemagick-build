name: Labeler

# pull_request_target so PRs from forks can be labeled too. It runs with
# a write token in the base repo's context, so this workflow must never
# check out or run anything from the PR: actions/labeler reads the config
# from the base branch and the changed file list from the API.

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7.0.0
