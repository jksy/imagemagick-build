name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  readme-sync:
    name: Verify README.md is in sync with libraries.json
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check README.md
        run: bash scripts/sync-readme.sh --check

  build-and-test:
    name: Build and Test ImageMagick (${{ matrix.os_tag }}-${{ matrix.arch }}${{ matrix.variant && format(', {0}', matrix.variant) || '' }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os_tag: ubuntu22.04
            arch: x86_64
          - runner: ubuntu-24.04
            os_tag: ubuntu24.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            os_tag: ubuntu22.04
            arch: aarch64
          - runner: ubuntu-24.04-arm
            os_tag: ubuntu24.04
            arch: aarch64
          # Ubuntu 26.04 runner images are still in public preview.
          - runner: ubuntu-26.04
            os_tag: ubuntu26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            os_tag: ubuntu26.04
            arch: aarch64
          - runner: ubuntu-24.04
            container: amazonlinux:2023
            os_tag: amzn2023
            arch: x86_64
          - runner: ubuntu-24.04-arm
            container: amazonlinux:2023
            os_tag: amzn2023
            arch: aarch64
          # Amazon Linux 2027 is still in public preview.
          - runner: ubuntu-24.04
            container: amazonlinux:2027
            os_tag: amzn2027
            arch: x86_64
          - runner: ubuntu-24.04-arm
            container: amazonlinux:2027
            os_tag: amzn2027
            arch: aarch64
          # The no-openmp variant is exercised on a single platform to keep
          # PR CI cost reasonable; release builds (build.yml) cover every
          # platform in both variants.
          - runner: ubuntu-24.04
            os_tag: ubuntu24.04
            arch: x86_64
            variant: no-openmp

    steps:
      - name: Install tar, gzip and git (Amazon Linux minimal container)
        if: startsWith(matrix.os_tag, 'amzn')
        run: dnf install -y tar gzip git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keep apt-get from hanging on a stalled mirror
        if: ${{ !startsWith(matrix.os_tag, 'amzn') }}
        uses: jksy/apt-install-unstuck@bd510647f3fa593582319f2c1c357688e566111c # v0.2.0

      - name: Build and verify ImageMagick
        uses: ./.github/actions/build-imagemagick
        with:
          cache_suffix: ${{ matrix.os_tag }}-${{ matrix.arch }}
          disable_openmp: ${{ matrix.variant == 'no-openmp' && 'true' || 'false' }}

  ci-passed:
    if: always()
    needs: [readme-sync, build-and-test]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Check CI results
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          failed="$(jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")' <<<"$NEEDS")"
          if [[ -n "$failed" ]]; then
            echo "::error::CI jobs did not succeed: $failed"
            exit 1
          fi
