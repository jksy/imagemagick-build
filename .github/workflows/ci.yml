name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  readme-sync:
    name: Verify README.md is in sync with libraries.json
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check README.md
        run: bash scripts/sync-readme.sh --check

  build-and-test:
    name: Build and Test ImageMagick (${{ matrix.os_tag }}-${{ matrix.arch }}${{ matrix.variant && format(', {0}', matrix.variant) || '' }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os_tag: ubuntu22.04
            arch: x86_64
          - runner: ubuntu-24.04
            os_tag: ubuntu24.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            os_tag: ubuntu22.04
            arch: aarch64
          - runner: ubuntu-24.04-arm
            os_tag: ubuntu24.04
            arch: aarch64
          # Ubuntu 26.04 runner images are still in public preview.
          - runner: ubuntu-26.04
            os_tag: ubuntu26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            os_tag: ubuntu26.04
            arch: aarch64
          - runner: ubuntu-24.04
            container: amazonlinux:2023
            os_tag: amzn2023
            arch: x86_64
          - runner: ubuntu-24.04-arm
            container: amazonlinux:2023
            os_tag: amzn2023
            arch: aarch64
          # The no-openmp variant is exercised on a single platform to keep
          # PR CI cost reasonable; release builds (build.yml) cover every
          # platform in both variants.
          - runner: ubuntu-24.04
            os_tag: ubuntu24.04
            arch: x86_64
            variant: no-openmp

    steps:
      - name: Install tar and git (AL2023 minimal container)
        if: matrix.os_tag == 'amzn2023'
        run: dnf install -y tar git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify ImageMagick
        uses: ./.github/actions/build-imagemagick
        with:
          cache_suffix: ${{ matrix.os_tag }}-${{ matrix.arch }}
          disable_openmp: ${{ matrix.variant == 'no-openmp' && 'true' || 'false' }}
