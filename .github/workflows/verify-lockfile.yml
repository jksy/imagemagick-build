name: verify-lockfile

# Fails when .github/workflows/actions.lock is out of sync with the
# workflows or a locked pin no longer verifies upstream.
# Regenerate it with `gh actions-lock` after changing any `uses:`.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-lockfile:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.0
      - name: Verify the lockfile
        run: gh actions-lock --verify --no-interactive
