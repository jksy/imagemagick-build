name: Sync README on libraries.json change

# SECURITY: This workflow uses `pull_request_target`, which runs in the context of
# the base branch with access to secrets. We therefore execute only trusted code
# (the script and README from the base ref) and never check out the PR head.
# We pull only `libraries.json` from the PR via `git fetch` so the PR cannot
# influence which code runs.

on:
  pull_request_target:
    paths:
      - 'libraries.json'

permissions:
  contents: write

jobs:
  sync:
    name: Auto-sync README.md to libraries.json
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout base ref (trusted)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          token: ${{ secrets.GH_PAT }}

      - name: Pull libraries.json from PR head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "pull/${PR_NUMBER}/head"
          git checkout FETCH_HEAD -- libraries.json

      - name: Regenerate README from PR's libraries.json
        run: bash scripts/sync-readme.sh

      - name: Push README change to PR branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet README.md; then
            echo "README.md is already in sync."
            exit 0
          fi

          NEW_README_TMP=$(mktemp)
          cp README.md "${NEW_README_TMP}"

          git fetch origin "${HEAD_REF}"
          # -f discards the README.md change made by sync-readme.sh in the
          # working tree (already saved to NEW_README_TMP above) so the
          # checkout to the PR head ref does not abort.
          git checkout -f -B "${HEAD_REF}" "origin/${HEAD_REF}"
          cp "${NEW_README_TMP}" README.md

          # The PR branch may already contain the regenerated README (e.g. the
          # bumper bot updated it). In that case there is nothing to commit.
          if git diff --quiet README.md; then
            echo "PR branch README.md is already up to date."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync README.md with libraries.json"
          git push origin "HEAD:${HEAD_REF}"
